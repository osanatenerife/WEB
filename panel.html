<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel interno — Osana</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/panel.css?v=17">
</head>
<body>

<div id="panel-login" class="panel-login">
  <div class="panel-login-box">
    <div class="panel-login-title">Osana · Panel interno</div>
    <p class="panel-login-sub">Acceso solo para el equipo</p>
    <input type="password" id="panel-key-input" placeholder="Clave de acceso" autocomplete="off">
    <button type="button" id="panel-key-submit" class="panel-btn panel-btn-primary">Entrar</button>
    <p id="panel-key-error" class="panel-login-error" style="display:none;"></p>
  </div>
</div>

<div id="panel-app" class="panel-app" style="display:none;">
  <div class="panel-topbar">
    <div class="panel-brand">Osana · Panel interno <span class="panel-lock">🔒 solo equipo</span></div>
    <button type="button" id="panel-logout" class="panel-link-btn">Cerrar sesión</button>
  </div>

  <div class="panel-mode-toggle">
    <button type="button" id="panel-mode-existing-btn" class="panel-mode-btn panel-mode-btn-active">🔍 Clienta existente</button>
    <button type="button" id="panel-mode-new-btn" class="panel-mode-btn">+ Clienta nueva</button>
  </div>

  <div id="panel-existing-view">
    <div class="panel-search-row">
      <input type="text" id="panel-search-input" class="panel-search-input" placeholder="Buscar por teléfono, email o nombre…">
      <button type="button" id="panel-search-btn" class="panel-btn panel-btn-primary">Buscar</button>
    </div>
    <p id="panel-search-error" class="panel-error" style="display:none;"></p>
    <p id="panel-search-status" class="panel-status" style="display:none;"></p>
    <div id="panel-results"></div>
  </div>

  <div id="panel-new-view" style="display:none;">
    <div id="panel-newclient-slot"></div>
  </div>

  <div class="panel-tools-row">
    <button type="button" id="panel-agenda-toggle" class="panel-btn panel-btn-ghost">📋 Agenda</button>
    <button type="button" id="panel-payments-toggle" class="panel-btn panel-btn-ghost">🧾 Comprobar cobros</button>
    <button type="button" id="panel-sale-toggle" class="panel-btn panel-btn-ghost">💰 Venta de producto</button>
    <button type="button" id="panel-quote-toggle" class="panel-btn panel-btn-ghost">🧾 Presupuesto personalizado</button>
    <button type="button" id="panel-gift-toggle" class="panel-btn panel-btn-ghost">🎁 Bono regalo</button>
    <button type="button" id="panel-discount-toggle" class="panel-btn panel-btn-ghost">🏷️ Descuentos</button>
    <button type="button" id="panel-campaign-toggle" class="panel-btn panel-btn-ghost">📧 Campaña de email</button>
    <button type="button" id="panel-report-toggle" class="panel-btn panel-btn-ghost">📊 Informe trimestral</button>
  </div>
  <div id="panel-report-slot"></div>
  <div id="panel-payments-slot"></div>
  <div id="panel-sale-slot"></div>
  <div id="panel-quote-slot"></div>
  <div id="panel-agenda-slot"></div>
  <div id="panel-gift-slot"></div>
  <div id="panel-discount-slot"></div>
  <div id="panel-campaign-slot"></div>
</div>

<script src="js/booking-config.js"></script>
<script src="js/panel.js?v=69"></script>
</body>
</html>
